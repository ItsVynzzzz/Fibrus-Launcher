# Mesin Rust Starling (MIT) untuk Fibrus Launcher. Dikompilasi dari sumber oleh workflow "Bangun mesin Starling",
# diterbitkan sebagai Release di repo ini, lalu dipasang ke APK oleh Gradle (scripts/fetch-horizon-engine.sh).
# Panduan lengkap: docs/rust-engine.md

enabled=true

# Sumber mesin (disalin dari AmberLauncher). Periksa diff-nya sendiri sebelum mengganti commit=.
source_repo=https://github.com/CihuyAkz/starling-extras
commit=32961a037f4127904262ab651f08d73a1d262a84

# release (ThinLTO, lambat) atau fast
profile=release

# Perubahan pada sumber mesin: third_party/horizon-patches/<patch_set>/*.diff
# amber5 = bawaan Amber (kontrol bawaan mesin bisa dimatikan dengan AMBER_CONTROLS=1; Discord dan pembaruan bawaan mati).
# Saat mulai memodif mesin: salin folder amber5 menjadi fibrus1, ganti patch_set di sini, lalu tambah diff milikmu.
patch_set=amber5

# Mod native yang dikompilasi ke dalam pustaka. Kosong = tanpa mod (kerangka kosongan).
native_mods=

revision=1
ndk=28.2.13676358

# Repo tempat Release mesin diterbitkan dan diambil.
release_repo=ItsVynzzzz/Fibrus-Launcher
