# Mengompilasi mesin Rust Starling dari sumber dan menerbitkannya sebagai Release di repo ini.
# Jalankan dari tab Actions > "Bangun mesin Starling" > Run workflow. Ulangi hanya bila commit= atau patch_set di
# starling-engine.properties, atau isi third_party/horizon-patches/<patch_set>, berubah. Panduan: docs/rust-engine.md
name: Bangun mesin Starling

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "release = penuh (ThinLTO, lambat, butuh banyak RAM). fast = tanpa LTO, lebih cepat (untuk mencoba)"
        type: choice
        options: [release, fast]
        default: release
      force:
        description: Bangun ulang walau Release untuk commit ini sudah ada
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: starling-engine
  cancel-in-progress: false

jobs:
  engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      HORIZON_TELEMETRY_URL: "off"
    steps:
      - uses: actions/checkout@v5

      # Eksporter tabel data proyek sumber dikompilasi dengan JDK yang dipatok proyek itu (Java 25).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      # Sumber, unduhan sementara, dan target Rust makan beberapa GB: kerjakan di /mnt, bukan di disk akar.
      - name: Siapkan ruang disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost || true
          sudo mkdir -p /mnt/starling-engine
          sudo chown "$USER" /mnt/starling-engine
          df -h / /mnt

      # Fibrus hanya memakai Starling: skrip dipanggil langsung dalam mode "satu mesin" (AMBER_ENGINE_CHILD=1),
      # jadi mesin Horizon tidak ikut dibangun.
      - name: Bangun dan terbitkan mesin
        env:
          GH_TOKEN: ${{ github.token }}
          AMBER_ENGINE_CHILD: "1"
          AMBER_ENGINE: starling
          HORIZON_ENGINE_CONFIG: ${{ github.workspace }}/starling-engine.properties
          HORIZON_ENGINE_PROFILE: ${{ inputs.profile }}
          HORIZON_ENGINE_FORCE: ${{ inputs.force }}
          HORIZON_ENGINE_WORK: /mnt/starling-engine
        run: bash scripts/build-horizon-engine.sh --publish
