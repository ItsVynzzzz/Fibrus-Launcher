# Membangun APK uji (debug). Mesin Starling diambil dari Release repo ini oleh Gradle (fetchStarlingEngine);
# jalankan workflow "Bangun mesin Starling" sekali lebih dulu.
name: Bangun APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Terima lisensi Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
      - name: Bangun
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FIBRUS_VERSION_NAME: 0.1.0-uji.${{ github.run_number }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Fibrus-debug-apk
          path: app/build/outputs/apk/debug/*.apk
